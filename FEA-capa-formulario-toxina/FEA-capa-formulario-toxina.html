<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:400px;overflow:hidden;background:#070B0A}
.c{position:relative;width:1600px;height:400px;overflow:hidden;
 background:radial-gradient(ellipse 420px 150px at 280px 112px,rgba(120,220,190,.16),transparent 70%),radial-gradient(ellipse 620px 420px at 1330px 230px,rgba(0,150,112,.42),rgba(0,87,67,.12) 55%,transparent 75%),
 linear-gradient(100deg,#060908 0%,#0A1412 48%,#0C1C18 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,transparent 100%)}
.ring{position:absolute;border:1px solid rgba(0,170,128,.22);border-radius:50%}
.r1{width:520px;height:520px;left:1075px;top:-40px}
.r2{width:700px;height:700px;left:985px;top:-130px;border-color:rgba(0,170,128,.10)}
.left{position:absolute;left:96px;top:0;height:400px;display:flex;flex-direction:column;justify-content:center;width:880px}
.logo{width:360px;display:block;margin-bottom:34px}
.eyebrow{font:600 13px/1 Montserrat;letter-spacing:.32em;color:#5FC4A6;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.eyebrow:before{content:"";width:36px;height:2px;background:#00A57D;border-radius:2px}
h1{font:700 58px/1.04 Sora;color:#fff;letter-spacing:-.015em}
h1 span{display:block;font-weight:600;color:#8FDCC3}
.photo{position:absolute;right:60px;bottom:-80px;height:500px;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 14%,#000 100%),linear-gradient(0deg,transparent 0,#000 30px);
 -webkit-mask-composite:source-in;mask-composite:intersect;filter:drop-shadow(0 0 40px rgba(0,0,0,.5))}
.tag{position:absolute;right:500px;bottom:34px;font:500 13px/1.3 Montserrat;color:rgba(255,255,255,.82);text-align:right;
 background:rgba(6,10,9,.55);border:1px solid rgba(143,220,195,.25);border-radius:999px;padding:8px 16px;backdrop-filter:blur(4px)}
.tag b{font:700 13px Sora;color:#fff}
.bar{position:absolute;left:0;bottom:0;width:100%;height:4px;background:linear-gradient(90deg,#005743,#00A57D 50%,#005743)}
</style></head><body>
<div class="c">
 <div class="grid"></div><div class="ring r2"></div><div class="ring r1"></div>
 <img class="photo" src="FEA-dr-joao-recorte.png" alt="Dr. João Pithon">
 <div class="left">
  <img class="logo" src="FEA-logo-mtb.png" alt="Masterclass em Toxina Botulínica">
  <div class="eyebrow">Pesquisa</div>
  <h1>Toxina Botulínica<span>na Prática Clínica</span></h1>
 </div>
 <div class="tag"><b>Dr. João Pithon</b></div>
 <div class="bar"></div>
</div>
</body></html>
