<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:400px;overflow:hidden;background:#060908}
.c{position:relative;width:1600px;height:400px;overflow:hidden;
 background:
  radial-gradient(ellipse 700px 260px at 50% 55%,rgba(0,150,112,.28),transparent 70%),
  radial-gradient(ellipse 500px 300px at 0% 100%,rgba(0,87,67,.35),transparent 70%),
  radial-gradient(ellipse 500px 300px at 100% 0%,rgba(0,87,67,.30),transparent 70%),
  linear-gradient(180deg,#070B0A,#0A1513)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px;
 -webkit-mask-image:radial-gradient(ellipse 60% 80% at 50% 50%,transparent 30%,#000 75%)}
.arc{position:absolute;border-radius:50%;border:1.5px solid rgba(110,210,180,.16)}
.a1{width:560px;height:560px;left:-300px;top:-80px}
.a2{width:760px;height:760px;left:-420px;top:-180px;border-color:rgba(110,210,180,.07)}
.a3{width:560px;height:560px;right:-300px;top:-80px}
.a4{width:760px;height:760px;right:-420px;top:-180px;border-color:rgba(110,210,180,.07)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:300px;margin-bottom:34px}
.eyebrow{font:600 14px/1 Montserrat;letter-spacing:.34em;color:#6FCCB0;text-transform:uppercase;display:flex;align-items:center;gap:18px;margin-bottom:20px}
.eyebrow:before,.eyebrow:after{content:"";width:56px;height:1.5px;background:linear-gradient(90deg,transparent,#00A57D)}
.eyebrow:after{transform:scaleX(-1)}
h1{font:800 64px/1 Sora;color:#fff;letter-spacing:-.02em;white-space:nowrap}
h1 span{font-weight:600;color:#8FDCC3}
.by{margin-top:24px;font:500 17px/1 Montserrat;color:rgba(255,255,255,.66);letter-spacing:.02em}
.by b{font:700 17px Sora;color:#fff;letter-spacing:0}
.bar{position:absolute;left:0;bottom:0;width:100%;height:5px;background:linear-gradient(90deg,#005743,#00A57D 50%,#005743)}
</style></head><body>
<div class="c">
 <div class="grid"></div>
 <div class="arc a2"></div><div class="arc a1"></div><div class="arc a4"></div><div class="arc a3"></div>
 <div class="wrap">
  <img class="logo" src="FEA-logo-mtb.png" alt="Masterclass em Toxina Botulínica">
  <div class="eyebrow">Formulário de pesquisa</div>
  <h1>Toxina Botulínica <span>na Prática Clínica</span></h1>
  <div class="by">com <b>Dr. João Pithon</b></div>
 </div>
 <div class="bar"></div>
</div>
</body></html>
