<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:500;src:url(../../fonts/Montserrat-Medium.ttf)}
@font-face{font-family:M;font-weight:700;src:url(../../fonts/Montserrat-SemiBold.ttf)}
@font-face{font-family:M;font-weight:800;src:url(../../fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:M;font-weight:900;src:url(../../fonts/Montserrat-Black.ttf)}
html,body{margin:0;background:transparent}
.faixa{width:1080px;height:150px;background:#fff;display:flex;align-items:center;justify-content:center;gap:22px;font-family:M;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.faixa:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#ecd08a,#a87b2c)}
.txt{color:#1c2b44;font-size:31px;line-height:1.08;text-align:right;font-weight:500}
.txt b{font-weight:800}
.box{background:#1c2b44;color:#fff;border-radius:10px;padding:10px 22px 12px;display:flex;align-items:baseline;gap:8px;border:3px solid #b8913f}
.box .v{font-weight:900;font-size:58px;letter-spacing:-1px;color:#fff}
.box .v span{color:#ecd08a}
.box .m{font-weight:700;font-size:24px;color:#ecd08a}
.sep{width:3px;height:84px;background:#b8913f;border-radius:2px}
.ic{height:86px}
</style></head><body>
<div class="faixa" id="f"><div class="txt">Para injetores que<br><b>faturam mais de</b></div>
<div class="box"><div class="v">R$ 15 MIL</div><div class="m">/ mês</div></div>
<div class="sep"></div><img class="ic" src="icone.svg"></div></body></html>
