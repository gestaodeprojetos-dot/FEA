<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Capa YouTube B</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* paleta FEP (brandbook): preto, off-white, azul, roxo, dourado */
:root{--preto:#050507;--off:#EEECEA;--azul:#3446BE;--roxo:#75438A;--ouro:#B8925A;--ouro2:#B8925A}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;padding:20px}
/* 2560x1440, área segura (aparece em todos os aparelhos): 1546x423 centralizada */
.capa{width:2560px;height:1440px;position:relative;overflow:hidden;font-family:Montserrat,sans-serif;
 background:var(--off)}
.onda{position:absolute;left:-200px;right:-200px;top:820px;height:260px}
.linha-ouro{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(213,175,116,.55) 30%,rgba(213,175,116,.55) 70%,transparent)}
.segura{position:absolute;left:507px;top:508px;width:1546px;height:423px}
.halo{position:absolute;left:520px;top:-80px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(117,67,138,.42) 0%,rgba(90,70,170,.22) 40%,rgba(117,67,138,0) 72%);filter:blur(24px)}
.foto{position:absolute;left:615px;top:-6px;height:660px;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%)}
.logo{position:absolute;left:0;top:34px;height:46px}
.nome{position:absolute;left:0;top:112px;font:600 82px Sora;color:#0b0b0c;letter-spacing:-.02em;line-height:1}
.fio{position:absolute;left:0;top:222px;width:110px;height:2px;background:var(--ouro)}
.cargo{position:absolute;left:0;top:246px;font:500 19px Montserrat;color:var(--ouro);letter-spacing:.2em;text-transform:uppercase}
.tese{position:absolute;left:0;top:296px;width:560px;font:300 30px/1.35 Montserrat;color:#1d1b22}
.tese b{font-weight:500;color:var(--ouro)}
.dir{position:absolute;right:0;top:34px;width:520px}
.item{padding:16px 0 16px 26px;border-left:2px solid var(--ouro)}
.item+.item{margin-top:14px}
.item small{display:block;font:500 17px Montserrat;color:var(--ouro);letter-spacing:.26em;text-transform:uppercase}
.item span{display:block;font:400 30px Montserrat;color:#1d1b22;margin-top:6px}
.cta{position:absolute;right:0;top:348px;width:520px;display:flex;align-items:center;gap:16px;padding-left:28px;font:600 21px Montserrat;color:var(--ouro);letter-spacing:.26em;text-transform:uppercase}
.cta i{width:38px;height:26px;border:2px solid var(--ouro);border-radius:7px;position:relative;flex:none}
.cta i:after{content:'';position:absolute;left:13px;top:5px;border-left:10px solid var(--ouro);border-top:6px solid transparent;border-bottom:6px solid transparent}
</style></head><body>
<div class="capa" id="capa">
 <svg class="onda" viewBox="0 0 2960 260" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3446BE"/><stop offset="1" stop-color="#75438A"/></linearGradient></defs><path d="M0 230 C 700 60, 1300 40, 1900 120 S 2700 200, 2960 60 L2960 110 C 2700 250, 2300 170, 1900 160 S 700 110, 0 260 Z" fill="url(#g)" opacity=".9"/></svg>
 <div class="segura">
  <img class="logo" src="marca/FEP-SYMBOL-BLACK-trim.png" alt="FEP">
  <div class="nome">Dr. João Pithon</div>
  <div class="fio"></div>
  <div class="cargo">Médico · professor · pesquisador</div>
  <div class="tese">Anatomia e técnica para quem injeta com <b>segurança</b>.</div>
  <div class="halo"></div>
  <img class="foto" src="../FEA-recortes-dr-joao/FEA-joao-recorte-077.png" alt="">
  <div class="dir">
   <div class="item"><small>Fundador</small><span>Injetores de Elite</span></div>
   <div class="item"><small>Trajetória</small><span>9 experiências internacionais</span></div>
  </div>
  <div class="cta"><i></i>Inscreva-se no canal</div>
 </div>
</div>
</body></html>
