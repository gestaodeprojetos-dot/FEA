<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Capa YouTube D</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--off:#F3F1EE;--ouro:#D5AF74}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;padding:20px}
/* 2560x1440, área segura 1546x423 centralizada (x 507, y 508) */
.capa{width:2560px;height:1440px;position:relative;overflow:hidden;background:#0a0b14}
/* fundo: a mesma foto ampliada e desfocada, para estender o ambiente para os lados */
.fundo{position:absolute;inset:-80px;background:url(marca/foto-48-ambiente.jpg) center 22%/cover;filter:blur(26px) brightness(.55) saturate(1.1)}
/* foto nítida do Dr. João no ambiente real (centro cirúrgico), com as bordas fundidas ao fundo */
.foto{position:absolute;left:1180px;top:425px;width:580px;height:870px;background:url(marca/foto-48-ambiente.jpg) center/cover;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 80%,transparent 100%)}
.escuro{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,7,16,.92) 0%,rgba(6,7,16,.78) 34%,rgba(6,7,16,.1) 50%,rgba(6,7,16,0) 62%,rgba(6,7,16,.55) 78%,rgba(6,7,16,.85) 100%)}
.segura{position:absolute;left:507px;top:508px;width:1546px;height:423px}
.sobre{position:absolute;left:0;top:30px;font:500 18px Montserrat;color:var(--ouro);letter-spacing:.26em;text-transform:uppercase}
.titulo{position:absolute;left:0;top:70px;width:640px;font:400 76px/1.02 'Cormorant Garamond',serif;color:var(--off);letter-spacing:-.01em}
.titulo em{font-style:italic;font-weight:500;color:var(--ouro)}
.bloco{position:absolute;right:0;top:110px;width:330px;display:flex;flex-direction:column;align-items:center;gap:20px}
.bloco img{height:50px}
.pill{display:flex;align-items:center;gap:14px;border:1.5px solid rgba(243,241,238,.55);border-radius:999px;padding:12px 24px;font:600 17px Montserrat;color:var(--off);letter-spacing:.22em;text-transform:uppercase;background:rgba(10,11,20,.35)}
.pill svg{width:38px;height:26px;flex:none}
.faixa{position:absolute;left:0;right:0;top:874px;height:56px;background:rgba(6,7,16,.72);border-top:1px solid rgba(213,175,116,.35);border-bottom:1px solid rgba(213,175,116,.35);display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.faixa span{font:500 21px Montserrat;color:var(--off);letter-spacing:.2em;text-transform:uppercase;padding-left:30px}
.faixa b{color:var(--ouro);font-weight:500;padding:0 18px}
</style></head><body>
<div class="capa" id="capa">
 <div class="fundo"></div>
 <div class="foto"></div>
 <div class="escuro"></div>
 <div class="segura">
  <div class="sobre">Dr. João Pithon · médico, professor e pesquisador</div>
  <div class="titulo">Anatomia e técnica para quem injeta com <em>segurança</em>.</div>
  <div class="bloco">
   <img src="marca/FEP-SYMBOL-WHITE-trim.png" alt="FEP">
   <div class="pill"><svg viewBox="0 0 46 32"><rect width="46" height="32" rx="8" fill="#FF0000"/><path d="M18 9 L31 16 L18 23 Z" fill="#fff"/></svg>Inscreva-se</div>
  </div>
 </div>
 <div class="faixa"><span>Anatomia<b>•</b>Preenchimento<b>•</b>Toxina botulínica<b>•</b>Fios<b>•</b>Casos clínicos<b>•</b>Segurança<b>•</b>Anatomia<b>•</b>Preenchimento<b>•</b>Toxina botulínica<b>•</b>Fios<b>•</b>Casos clínicos<b>•</b>Segurança<b>•</b>Anatomia<b>•</b>Preenchimento<b>•</b>Toxina botulínica</span></div>
</div>
</body></html>
