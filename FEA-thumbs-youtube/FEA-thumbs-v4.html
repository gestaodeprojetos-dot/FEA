<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Thumbs v4</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F9F9F9;padding:24px 16px}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Sora,sans-serif;
 background:radial-gradient(circle at 78% 35%,#3846BB 0%,#2a2470 30%,#1E1B4B 55%,#0d0b24 100%)}
.grade{position:absolute;inset:0;background-image:radial-gradient(rgba(208,209,233,.18) 1.5px,transparent 1.5px);background-size:26px 26px;mask-image:linear-gradient(90deg,transparent 30%,#000 70%)}
.joao{position:absolute;right:-30px;bottom:-40px;height:800px;filter:drop-shadow(0 0 30px rgba(56,70,187,.8)) drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.tela{position:absolute;border-radius:18px;border:6px solid #fff;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-3deg);background-repeat:no-repeat}
.alvo{position:absolute;border:8px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #000}
.txt{position:absolute;color:#fff;font-weight:800;letter-spacing:-.03em;line-height:.95;text-shadow:0 6px 0 rgba(0,0,0,.6),0 10px 40px rgba(0,0,0,.7)}
.hl{display:inline-block;background:#D0D1E9;color:#1E1B4B;text-shadow:none;padding:2px 18px 10px;border-radius:12px;margin-top:10px}
.tag{position:absolute;right:20px;top:18px;font:700 22px Sora;color:#fff;background:#5B4599;padding:6px 14px;border-radius:8px}
</style></head><body>
<div class="thumb" id="h4">
 <div class="grade"></div>
 <img class="joao" src="recortes/FEA-joao-recorte-01.png" alt="">
 <div class="tela" style="left:48px;top:330px;width:600px;height:338px;background-image:url(antes/fV64CStfYYE.jpg);background-size:210%;background-position:38% 30%">
   <div class="alvo" style="left:262px;top:218px;width:120px;height:120px"></div>
 </div>
 <div class="txt" style="left:48px;top:40px;font-size:118px">Dá para<br><span class="hl">desfazer?</span></div>
</div>
</body></html>
