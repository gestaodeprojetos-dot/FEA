<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Thumbs v5</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F9F9F9;padding:24px 16px}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Sora,sans-serif;background:#000}
.bg{position:absolute;inset:0;background-repeat:no-repeat;filter:saturate(1.05) contrast(1.08) brightness(.92)}
.cine{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,10,.55) 0%,rgba(5,5,10,0) 40%),linear-gradient(90deg,rgba(5,5,10,0) 55%,rgba(5,5,10,.5) 100%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%)}
.joao{position:absolute;filter:drop-shadow(-20px 10px 40px rgba(0,0,0,.6))}
.txt{position:absolute;left:44px;top:34px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#fff;font-size:116px;text-shadow:0 6px 30px rgba(0,0,0,.55)}
.box{display:inline-block;margin-top:10px;background:#75438A;color:#fff;padding:4px 26px 16px;border-radius:22px;text-shadow:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.balao{position:absolute;background:#fff;color:#1d1b2e;font:700 26px Montserrat;padding:12px 22px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.balao:after{content:'';position:absolute;left:34px;bottom:-14px;border-top:16px solid #fff;border-right:16px solid transparent}
.alvo{position:absolute;border:7px solid #fff;border-radius:50%;box-shadow:0 0 24px rgba(0,0,0,.5)}
</style></head><body>
<div class="thumb" id="h5">
 <div class="bg" style="background-image:url(antes/fV64CStfYYE.jpg);background-size:155%;background-position:70% 0%"></div>
 <div class="cine"></div>
 <div class="alvo" style="left:336px;top:550px;width:140px;height:140px"></div>
 <div class="balao" style="left:420px;top:460px">hialuronidase ✨</div>
 <img class="joao" src="../FEA-recortes-dr-joao/FEA-joao-recorte-141.png" style="right:-70px;top:40px;height:1060px" alt="">
 <div class="txt">Dá para<br><span class="box">desfazer?</span></div>
</div>
</body></html>
