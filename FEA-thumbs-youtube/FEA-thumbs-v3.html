<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Thumbs v3</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F9F9F9;padding:24px 16px}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Sora,sans-serif;background:#000}
.bg{position:absolute;inset:0;background-repeat:no-repeat;filter:saturate(1.2) contrast(1.15) brightness(1.05)}
.vin{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 60%,rgba(0,0,0,0) 35%,rgba(0,0,0,.65) 100%)}
.txt{position:absolute;left:48px;top:36px;color:#fff;font-weight:800;font-size:132px;line-height:.95;letter-spacing:-.03em;
 text-shadow:0 0 2px #000,0 6px 0 rgba(0,0,0,.9),0 10px 40px rgba(0,0,0,.8);-webkit-text-stroke:3px #111;paint-order:stroke fill}
.txt .hl{background:#5B4599;-webkit-text-stroke:0;text-shadow:none;padding:0 18px 8px;border-radius:12px;display:inline-block;margin-top:14px}
.alvo{position:absolute;border:10px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #000,0 0 30px rgba(0,0,0,.6)}
.seta{position:absolute}
</style></head><body>
<div class="thumb" id="h3">
 <div class="bg" style="background-image:url(antes/fV64CStfYYE.jpg);background-size:210%;background-position:38% 30%"></div>
 <div class="vin"></div>
 <div class="alvo" style="left:560px;top:465px;width:240px;height:240px"></div>
 <svg class="seta" style="left:330px;top:340px" width="300" height="200" viewBox="0 0 300 200"><path d="M10 30 Q 150 10 250 120" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round"/><path d="M10 30 Q 150 10 250 120" fill="none" stroke="#D0D1E9" stroke-width="16" stroke-linecap="round"/><path d="M205 125 L265 140 L255 75 Z" fill="#D0D1E9" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>
 <div class="txt">Dá para<br><span class="hl">desfazer?</span></div>
</div>
</body></html>
