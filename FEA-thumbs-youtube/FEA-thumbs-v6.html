<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Thumbs v6</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F9F9F9;padding:24px 16px}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background-repeat:no-repeat;filter:saturate(.35) contrast(1.1) brightness(.62) blur(1.5px)}
.cine{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 45%,transparent 30%,rgba(0,0,0,.55) 100%)}
.joao{position:absolute;filter:drop-shadow(18px 10px 40px rgba(0,0,0,.7))}
.txt{position:absolute;left:470px;top:400px;transform:rotate(-3deg);transform-origin:left center;font-family:Montserrat,sans-serif;text-transform:uppercase;line-height:1}
.l1{display:block;color:#fff;font-weight:900;font-size:84px;letter-spacing:-.01em;text-shadow:0 4px 0 rgba(0,0,0,.85),0 8px 30px rgba(0,0,0,.7);padding-left:6px}
.l2{display:inline-block;margin-top:10px;background:linear-gradient(180deg,#E2C48F 0%,#D5AF74 55%,#C49A5C 100%);color:#111;font-weight:900;font-size:96px;letter-spacing:-.01em;padding:8px 24px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style></head><body>
<div class="thumb" id="h6">
 <div class="bg" style="background-image:url(antes/Wjkp9TDqp6E.jpg);background-size:150%;background-position:100% 0%"></div>
 <div class="cine"></div>
 <img class="joao" src="../FEA-recortes-dr-joao/FEA-joao-recorte-025.png" style="left:-90px;top:40px;height:1000px" alt="">
 <div class="txt"><span class="l1">Full face com</span><span class="l2">só 5 ml</span></div>
</div>
</body></html>
