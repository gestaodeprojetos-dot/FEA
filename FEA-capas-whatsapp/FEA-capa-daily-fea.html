<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Daily FEA</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;800&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--roxo:#5B4599;--azul:#3846BB;--lav:#D0D1E9;--off:#F9F9F9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222}
.capa{position:relative;overflow:hidden;color:var(--off);
 background:radial-gradient(120% 90% at 20% 10%,#6a52ad 0%,var(--roxo) 38%,var(--azul) 100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.rings span{position:absolute;border-radius:50%;border:1.5px solid rgba(208,209,233,.16)}
.daily{font-family:Sora;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--lav)}
.fea{font-family:Sora;font-weight:800;line-height:.9;letter-spacing:-.02em}
.bar{background:var(--lav);border-radius:4px}
.sub{font-family:Montserrat;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--lav)}
.sq .daily{font-size:64px;margin-bottom:6px;padding-left:.32em}
.sq .fea{font-size:250px}
.sq .bar{width:120px;height:6px;margin:34px 0 26px}
.sq .sub{font-size:21px;max-width:560px;line-height:1.5}
.st .daily{font-size:84px;margin-bottom:10px;padding-left:.32em}
.st .fea{font-size:330px}
.st .bar{width:150px;height:8px;margin:48px 0 34px}
.st .sub{font-size:27px;max-width:700px;line-height:1.5}
</style></head><body>
<div class="capa sq" id="sq">
 <div class="rings"><span style="width:760px;height:760px"></span><span style="width:940px;height:940px"></span><span style="width:1240px;height:1240px"></span></div>
 <div class="daily">Daily</div><div class="fea">FEA</div><div class="bar"></div>
 <div class="sub">Formação Especialista<br>em Anatomia</div>
</div>
<div class="capa st" id="st">
 <div class="rings"><span style="width:900px;height:900px"></span><span style="width:1120px;height:1120px"></span><span style="width:1500px;height:1500px"></span></div>
 <div class="daily">Daily</div><div class="fea">FEA</div><div class="bar"></div>
 <div class="sub">Formação Especialista<br>em Anatomia</div>
</div>
</body></html>
