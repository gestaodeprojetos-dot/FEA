<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pilares Elite Experience</title>
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: 'Canela'; src: url('assets/canela-regular.otf'); font-weight: 400; }
  @font-face { font-family: 'Canela'; src: url('assets/canela-light.otf'); font-weight: 300; }
  @font-face { font-family: 'Galano'; src: url('assets/galano-light.otf'); font-weight: 300; }
  @font-face { font-family: 'Galano'; src: url('assets/galano-medium.otf'); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffe2e9; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1100px 700px at 50% 52%, #ffe6ec, #ffe0e8 70%); }
  #bigtext { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  #elite { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font-family: 'Canela'; font-weight: 300; font-size: 470px; line-height: 1; letter-spacing: .01em; color: rgba(176, 82, 112, .075); }
  #exp { position: absolute; left: 0; right: 0; top: 628px; text-align: center; font-family: 'Galano'; font-weight: 300; font-size: 128px; line-height: 1; letter-spacing: .52em; padding-left: .52em; color: rgba(176, 82, 112, .07); }
  .ch { display: inline-block; }
  canvas { position: absolute; inset: 0; }
  .lab { position: absolute; width: 400px; margin-left: -200px; text-align: center; }
  .lab .n { font-family: 'Galano'; font-weight: 500; font-size: 21px; letter-spacing: .32em; padding-left: .32em; color: #a3294f; }
  .lab .t { font-family: 'Canela'; font-weight: 400; font-size: 56px; letter-spacing: -.01em; color: #151012; margin-top: 14px; line-height: 1; }
  #sphereWrap { position: absolute; left: 852px; top: 412px; width: 216px; height: 216px; }
  #sphere { position: absolute; inset: 0; width: 216px; height: 216px; }
  #sshadow { position: absolute; left: 862px; top: 590px; width: 196px; height: 56px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150, 30, 70, .28), rgba(150, 30, 70, 0)); }
  #halo { position: absolute; left: 960px; top: 520px; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .85), rgba(255, 210, 222, .35) 40%, rgba(255, 226, 233, 0) 70%); opacity: 0; }
  #fade { position: absolute; inset: 0; background: #ffe2e9; }
</style>
</head>
<body>
<div id="stage">
  <div id="bigtext"><div id="elite">ELITE</div><div id="exp">EXPERIENCE</div></div>
  <canvas id="rings" width="1920" height="1080"></canvas>
  <div class="lab" id="l1" style="left:960px;top:156px"><div class="n">01</div><div class="t">Atrair</div></div>
  <div class="lab" id="l2" style="left:786px;top:830px"><div class="n">02</div><div class="t">Converter</div></div>
  <div class="lab" id="l3" style="left:1132px;top:830px"><div class="n">03</div><div class="t">Entregar</div></div>
  <div id="halo"></div>
  <div id="sshadow"></div>
  <div id="sphereWrap"><img id="sphere" src="assets/sphere.png" alt=""></div>
  <div id="fade"></div>
</div>
<script>
// Os três círculos (medidos na arte do André): centro, raios e de onde o traço começa
const R = [
  { cx: 960, cy: 448, rx: 320, ry: 176, a0: Math.PI * 1.08, dir: 1, dark: 'left' },
  { cx: 786, cy: 621, rx: 320, ry: 178, a0: Math.PI * 0.55, dir: 1, dark: 'left' },
  { cx: 1132, cy: 621, rx: 320, ry: 178, a0: Math.PI * 0.45, dir: -1, dark: 'right' },
];
const st = R.map(() => ({ p: 0, glow: 0 }));
const cv = document.getElementById('rings'), cx = cv.getContext('2d');

function ringPath(r, p) {
  cx.beginPath();
  const a1 = r.a0 + r.dir * p * Math.PI * 2;
  cx.ellipse(r.cx, r.cy, r.rx, r.ry, 0, r.a0, a1, r.dir < 0);
}
function draw() {
  cx.clearRect(0, 0, 1920, 1080);
  R.forEach((r, i) => {
    const p = st[i].p;
    if (p <= 0) return;
    // sombra suave do anel (o "vidro" da arte original)
    cx.save(); cx.filter = 'blur(14px)'; cx.translate(0, 26);
    ringPath(r, p); cx.strokeStyle = 'rgba(165, 55, 90, .13)'; cx.lineWidth = 20; cx.stroke(); cx.restore();
    // anel com gradiente vinho -> rosa
    const g = cx.createLinearGradient(r.cx - r.rx, r.cy - r.ry, r.cx + r.rx, r.cy + r.ry);
    const dark = '#9a2449', light = '#f8dbe2';
    if (r.dark === 'left') { g.addColorStop(0, dark); g.addColorStop(.5, '#d0869b'); g.addColorStop(1, light); }
    else { g.addColorStop(0, light); g.addColorStop(.5, '#d0869b'); g.addColorStop(1, dark); }
    ringPath(r, p); cx.strokeStyle = g; cx.lineWidth = 3.6; cx.lineCap = 'round'; cx.stroke();
    // brilho na ponta do traço enquanto ele é desenhado
    if (p < 1 || st[i].glow > 0) {
      const a = r.a0 + r.dir * p * Math.PI * 2, x = r.cx + Math.cos(a) * r.rx, y = r.cy + Math.sin(a) * r.ry;
      const k = p < 1 ? 1 : st[i].glow;
      const rg = cx.createRadialGradient(x, y, 0, x, y, 46);
      rg.addColorStop(0, `rgba(255,255,255,${.95 * k})`); rg.addColorStop(.3, `rgba(255,170,195,${.5 * k})`); rg.addColorStop(1, 'rgba(255,170,195,0)');
      cx.fillStyle = rg; cx.beginPath(); cx.arc(x, y, 46, 0, 6.283); cx.fill();
    }
  });
}

// letras do ELITE EXPERIENCE para revelar uma a uma
['elite', 'exp'].forEach(id => { const el = document.getElementById(id); el.innerHTML = [...el.textContent].map(c => `<span class="ch">${c}</span>`).join(''); });

const tl = gsap.timeline({ paused: true }), E = 'power3.out', IO = 'power2.inOut';
tl.to('#fade', { opacity: 0, duration: .6 }, 0);
gsap.set(['#elite .ch', '#exp .ch'], { opacity: 0 });

const RING_AT = [0.6, 2.4, 4.2], DRAW = 1.25;
RING_AT.forEach((t, i) => {
  tl.to(st[i], { p: 1, duration: DRAW, ease: IO }, t);
  tl.to(st[i], { glow: 1, duration: .01 }, t).to(st[i], { glow: 0, duration: .6 }, t + DRAW);
  const lab = `#l${i + 1}`;
  tl.from(`${lab} .n`, { opacity: 0, y: 14, duration: .6, ease: E }, t + .55);
  tl.from(`${lab} .t`, { opacity: 0, y: 28, filter: 'blur(8px)', duration: .8, ease: E }, t + .65);
});

// o Elite aparece
const REVEAL = 6.1;
tl.to('#halo', { opacity: 1, scale: 1.05, duration: .25, ease: 'power2.out' }, REVEAL - .05).to('#halo', { opacity: 0, scale: 1.25, duration: 1.4, ease: 'power2.out' }, REVEAL + .2);
tl.fromTo('#sphereWrap', { scale: 0, rotate: -40 }, { scale: 1, rotate: 0, duration: 1.1, ease: 'back.out(1.7)' }, REVEAL);
tl.fromTo('#sshadow', { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: 1, ease: E }, REVEAL + .1);
tl.to('#elite .ch', { opacity: 1, duration: .9, stagger: .09, ease: 'power1.out' }, REVEAL + .25);
tl.fromTo('#elite', { scale: 1.06 }, { scale: 1, duration: 2.4, ease: E }, REVEAL + .25);
tl.to('#exp .ch', { opacity: 1, duration: .7, stagger: .05, ease: 'power1.out' }, REVEAL + .7);
tl.fromTo('#exp', { letterSpacing: '.7em' }, { letterSpacing: '.52em', duration: 2.4, ease: E }, REVEAL + .7);
// respiração final
tl.to('#sphereWrap', { y: -6, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 2 }, REVEAL + 1.3);
tl.to('#stage', { scale: 1.02, duration: 11.6, ease: 'none' }, 0);

window.DURATION = 11.6;
window.seek = (t) => { tl.seek(t, false); draw(); };
window.ready = Promise.all([...document.images].map(i => i.decode().catch(() => {})));
seek(0);
</script>
</body>
</html>
