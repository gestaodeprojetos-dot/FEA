<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FEA Elite Contagem</title>
<style>
@font-face{font-family:Canela;src:url(assets/CanelaDeck-Regular.otf);font-weight:400}
@font-face{font-family:Canela;src:url(assets/CanelaDeck-Light.otf);font-weight:300}
@font-face{font-family:Canela;src:url(assets/CanelaDeck-Medium.otf);font-weight:500}
@font-face{font-family:Canela;src:url(assets/CanelaDeck-LightItalic.otf);font-weight:300;font-style:italic}
@font-face{font-family:Canela;src:url(assets/CanelaDeck-RegularItalic.otf);font-weight:400;font-style:italic}
@font-face{font-family:Galano;src:url(assets/Galano-Light.otf);font-weight:300}
@font-face{font-family:Galano;src:url(assets/Galano-Regular.otf);font-weight:400}
@font-face{font-family:Galano;src:url(assets/Galano-Medium.otf);font-weight:500}
@font-face{font-family:Galano;src:url(assets/Galano-SemiBold.otf);font-weight:600}

:root{--ice:#7FB3C6;--mist:#EBF2F5;--ink:#050C0F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--ink)}
.abs{position:absolute;left:0;top:0;width:100%}
.layer{position:absolute;inset:0}
#bg{background:
  radial-gradient(120% 70% at 50% -5%, #17323f 0%, #0a1820 38%, #050c0f 70%, #020507 100%)}
#spot{background:radial-gradient(42% 46% at 50% 0%, rgba(190,226,240,.55) 0%, rgba(127,179,198,.22) 38%, rgba(127,179,198,0) 72%);mix-blend-mode:screen}
#floor{background:radial-gradient(60% 18% at 50% 100%, rgba(127,179,198,.28) 0%, rgba(127,179,198,0) 70%);mix-blend-mode:screen}
.beam{position:absolute;top:-10%;left:50%;width:22%;height:130%;transform-origin:50% 0;
  background:linear-gradient(180deg, rgba(200,232,244,.22), rgba(127,179,198,0) 85%);filter:blur(28px);mix-blend-mode:screen}
#vignette{background:radial-gradient(85% 75% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%)}
canvas{position:absolute;inset:0}
#grain{opacity:.06;mix-blend-mode:overlay}

#Twrap{position:absolute;left:50%;transform-origin:50% 50%}
#Twrap img{display:block;width:100%}
#Tshine{position:absolute;inset:0;
  -webkit-mask:url(assets/T.png) center/100% 100% no-repeat;mask:url(assets/T.png) center/100% 100% no-repeat;
  background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%);background-size:300% 100%;mix-blend-mode:screen}

.label{font-family:Galano;font-weight:500;color:var(--mist);text-align:center;text-transform:uppercase;white-space:nowrap}
#header{font-weight:400;color:rgba(235,242,245,.78)}
#kicker{color:var(--ice);font-weight:500}
#unit{font-weight:500}

.num{font-family:Canela;font-weight:400;text-align:center;line-height:1;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 0%,#eef6f9 30%,#a9cddb 55%,#5f93a8 74%,#d9ecf3 92%,#ffffff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#numShine{background:linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 58%);
  background-size:320% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:screen}
#numGlow{position:absolute;left:50%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(210,238,248,.9), rgba(127,179,198,.35) 45%, rgba(127,179,198,0));mix-blend-mode:screen}
#flare{position:absolute;left:50%;height:4px;border-radius:4px;
  background:linear-gradient(90deg, rgba(127,179,198,0), rgba(230,246,252,1) 50%, rgba(127,179,198,0));
  box-shadow:0 0 30px 6px rgba(160,210,228,.55);mix-blend-mode:screen}
#prev{opacity:0}

#tag{font-family:Canela;font-weight:300;font-style:italic;color:var(--mist);text-align:center;line-height:1.22}
#tag span{display:inline-block;white-space:pre}

#logoWrap{position:absolute;left:50%}
#logoWrap img{display:block;width:100%}
#logoShine{position:absolute;inset:0;
  -webkit-mask:url(assets/logo.png) center/100% 100% no-repeat;mask:url(assets/logo.png) center/100% 100% no-repeat;
  background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%);background-size:320% 100%;mix-blend-mode:screen}

#foot{display:flex;align-items:center;justify-content:center;gap:0}
.rule{height:1px;background:linear-gradient(90deg, rgba(127,179,198,0), rgba(127,179,198,.9));transform-origin:100% 50%}
.rule.r{background:linear-gradient(90deg, rgba(127,179,198,.9), rgba(127,179,198,0));transform-origin:0 50%}
#footTxt{font-family:Galano;font-weight:400;color:var(--mist);text-transform:uppercase;white-space:nowrap}
#footTxt b{font-weight:600;color:#fff}
#flash{background:radial-gradient(60% 45% at 50% 40%, rgba(220,242,250,.55), rgba(127,179,198,0) 70%);mix-blend-mode:screen;opacity:0}
#fadeIn{background:#000}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="spot"></div>
  <div class="beam" id="b1"></div><div class="beam" id="b2"></div><div class="beam" id="b3"></div>
  <div class="layer" id="floor"></div>
  <div id="Twrap"><img src="assets/T.png" alt=""><div id="Tshine"></div></div>
  <canvas id="dust"></canvas>

  <div id="push" class="layer">
    <div class="abs label" id="header">Doutor João Pithon</div>
    <div class="abs label" id="kicker"></div>
    <div id="numGlow"></div>
    <div id="flare"></div>
    <div class="abs num" id="prev"></div>
    <div class="abs num" id="num"></div>
    <div class="abs num" id="numShine"></div>
    <div class="abs label" id="unit"></div>
    <div class="abs" id="tag"></div>
    <div id="logoWrap"><img src="assets/logo.png" alt=""><div id="logoShine"></div></div>
    <div class="abs" id="foot"><div class="rule" id="ruleL"></div><div id="footTxt"><b>01 e 02 de novembro</b>&nbsp;&nbsp;·&nbsp;&nbsp;WTC Sheraton, São Paulo</div><div class="rule r" id="ruleR"></div></div>
  </div>
  <div class="layer" id="flash"></div>
  <div class="layer" id="vignette"></div>
  <canvas id="grain"></canvas>
  <div class="layer" id="fadeIn"></div>
</div>

<script>
const Q = new URLSearchParams(location.search);
const N = parseInt(Q.get('n') ?? '11', 10);
const FMT = Q.get('fmt') || 'feed';
const W = 1080, H = FMT === 'story' ? 1920 : 1350;

const TAGS = {
  11: 'Dois dias de imersão em tendências globais,\nevidências reais e aplicação clínica.',
  10: 'Separe os dias 01 e 02 de novembro\nna sua agenda.',
  9:  'Evidência científica e aplicação clínica\nno mesmo palco.',
  8:  'Planeje sua chegada ao WTC Sheraton,\nem São Paulo.',
  7:  'Confirme sua inscrição\ne comece a se organizar.',
  6:  'Confira tudo o que você vai viver\nnos dias 01 e 02 de novembro.',
  5:  'Já convidou um colega para viver\nessa experiência com você?',
  4:  'Dois dias que podem mudar\na sua prática profissional.',
  3:  'Revise as informações\ndo seu ingresso.',
  2:  'O Elite Injectors Congress\nestá quase aí.',
  1:  'É amanhã. Separe seu ingresso\ne um documento com foto.',
  0:  'Nos vemos no WTC Sheraton,\nem São Paulo.'
};

const today = N === 0;
const kicker = today ? '01 de novembro' : (N === 1 ? 'Falta' : 'Faltam');
const numTxt = today ? 'É hoje' : String(N);
const prevTxt = today ? '1' : String(N + 1);
const unit = today ? 'Começa agora' : (N === 1 ? 'Dia' : 'Dias');

// Layout (px) per format
const L = FMT === 'story' ? {
  header: 250, headerFs: 24, kicker: 455, kickerFs: 36,
  numC: 815, numFs: today ? 300 : (N >= 10 ? 580 : 640),
  unit: 1105, unitFs: 46, tag: 1205, tagFs: 50,
  logoY: 1400, logoW: 640, foot: 1640, footFs: 24, ruleW: 70,
  T: {y: 560, w: 1240, op: .36}
} : {
  header: 64, headerFs: 22, kicker: 226, kickerFs: 32,
  numC: 535, numFs: today ? 250 : (N >= 10 ? 460 : 520),
  unit: 778, unitFs: 40, tag: 856, tagFs: 42,
  logoY: 1020, logoW: 540, foot: 1250, footFs: 21, ruleW: 60,
  T: {y: 350, w: 1000, op: .36}
};

const $ = id => document.getElementById(id);
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

function place(el, y, fs, extra = {}) {
  el.style.top = y + 'px'; el.style.fontSize = fs + 'px';
  Object.assign(el.style, extra);
}
place($('header'), L.header, L.headerFs, {letterSpacing: '.55em', paddingLeft: '.55em'});
$('kicker').textContent = kicker;
place($('kicker'), L.kicker, L.kickerFs, {letterSpacing: '.6em', paddingLeft: '.6em'});
for (const id of ['num', 'numShine', 'prev']) {
  const el = $(id);
  el.textContent = id === 'prev' ? prevTxt : numTxt;
  el.style.fontSize = L.numFs + 'px';
  el.style.lineHeight = '1';
  el.style.top = (L.numC - L.numFs * 0.52) + 'px';
  el.style.height = L.numFs + 'px';
}
if (today) { $('num').style.letterSpacing = '-.01em'; $('numShine').style.letterSpacing = '-.01em'; }
$('unit').textContent = unit;
place($('unit'), L.unit, L.unitFs, {letterSpacing: '.7em', paddingLeft: '.7em'});

// tagline as word spans
const tag = $('tag');
place(tag, L.tag, L.tagFs);
const words = [];
TAGS[N].split('\n').forEach((line, li) => {
  if (li) tag.appendChild(document.createElement('br'));
  line.split(' ').forEach((w, wi, arr) => {
    const s = document.createElement('span');
    s.textContent = w + (wi < arr.length - 1 ? ' ' : '');
    tag.appendChild(s); words.push(s);
  });
});

const lw = $('logoWrap');
lw.style.width = L.logoW + 'px'; lw.style.top = L.logoY + 'px'; lw.style.marginLeft = (-L.logoW / 2) + 'px';
const foot = $('foot'); foot.style.top = L.foot + 'px';
$('footTxt').style.fontSize = L.footFs + 'px'; $('footTxt').style.letterSpacing = '.32em';
$('footTxt').style.padding = '0 26px';
$('ruleL').style.width = $('ruleR').style.width = L.ruleW + 'px';

const Tw = $('Twrap'); Tw.style.width = L.T.w + 'px'; Tw.style.marginLeft = (-L.T.w / 2) + 'px';
Tw.style.top = (L.T.y - L.T.w * 0.4322) + 'px';

const glow = $('numGlow'); const gS = L.numFs * 1.5;
glow.style.width = gS + 'px'; glow.style.height = gS * .7 + 'px';
glow.style.marginLeft = (-gS / 2) + 'px'; glow.style.top = (L.numC - gS * .35) + 'px';
const flare = $('flare'); flare.style.top = (L.numC - 2) + 'px';

const beams = [[$('b1'), -24, 0], [$('b2'), 0, 1.7], [$('b3'), 24, 3.1]];
beams.forEach(([b]) => { b.style.marginLeft = '-11%'; });

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;

// ---------- particles (deterministic) ----------
const dust = $('dust'); dust.width = W; dust.height = H; const dctx = dust.getContext('2d');
let seed = 1234567;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const P = Array.from({length: FMT === 'story' ? 140 : 110}, () => ({
  x: rnd() * W, y: rnd() * H, z: .25 + rnd() * .75, ph: rnd() * 6.283, sp: 8 + rnd() * 26, dr: (rnd() - .5) * 14
}));
function drawDust(t, a) {
  dctx.clearRect(0, 0, W, H);
  for (const p of P) {
    const y = ((p.y - p.sp * p.z * t) % H + H) % H;
    const x = p.x + Math.sin(t * .6 + p.ph) * p.dr;
    const tw = .55 + .45 * Math.sin(t * 2.1 + p.ph * 3);
    // brighter inside the spotlight cone
    const cone = Math.exp(-Math.pow((x - W / 2) / (W * .32 + y * .25), 2));
    const alpha = a * tw * p.z * (.18 + .75 * cone);
    const r = .6 + p.z * 2.2;
    const g = dctx.createRadialGradient(x, y, 0, x, y, r * 3);
    g.addColorStop(0, `rgba(225,243,250,${alpha})`); g.addColorStop(1, 'rgba(225,243,250,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r * 3, 0, 6.283); dctx.fill();
  }
}
// static film grain (per-frame seeded)
const grain = $('grain'); grain.width = W / 2; grain.height = H / 2; const gctx = grain.getContext('2d');
grain.style.width = W + 'px'; grain.style.height = H + 'px';
const gimg = gctx.createImageData(W / 2, H / 2);
function drawGrain(frame) {
  let s = 9973 + frame * 7919;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    s = (s * 16807) % 2147483647; const v = (s & 255);
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

// ---------- timeline ----------
const DUR = 10;
function render(t, frame = 0) {
  // global fade from black
  $('fadeIn').style.opacity = 1 - outCubic(prog(t, 0, .7));

  // light rig
  const s = outCubic(prog(t, .1, 1.6));
  $('spot').style.opacity = s * (0.92 + .08 * Math.sin(t * 1.3));
  $('floor').style.opacity = s * .9;
  beams.forEach(([b, ang, ph]) => {
    b.style.transform = `rotate(${ang + Math.sin(t * .35 + ph) * 6}deg)`;
    b.style.opacity = s * (.55 + .2 * Math.sin(t * .8 + ph));
  });
  drawDust(t, s);
  drawGrain(frame);

  // chrome T monogram: rises and settles, slow breathing
  const tp = outExpo(prog(t, .2, 2.4));
  Tw.style.opacity = L.T.op * tp;
  Tw.style.transform = `translateY(${lerp(80, 0, tp)}px) scale(${lerp(1.12, 1, tp) + t * .004})`;
  Tw.style.filter = `blur(${lerp(10, 1.2, tp)}px) brightness(.85)`;
  $('Tshine').style.backgroundPosition = `${lerp(110, -10, inOut(prog(t, 6.6, 8.2)))}% 0`;
  $('Tshine').style.opacity = prog(t, 6.6, 6.8) * (1 - prog(t, 8.0, 8.2));

  // whole composition slow push
  $('push').style.transform = `scale(${1 + .03 * inOut(prog(t, 2, DUR))})`;

  // header
  const h = outCubic(prog(t, .5, 1.4));
  $('header').style.opacity = h * .9;
  $('header').style.letterSpacing = lerp(.9, .55, h) + 'em';

  // previous number ghost, then it dissolves
  const pIn = outCubic(prog(t, .5, 1.2)), pOut = prog(t, 1.55, 1.95);
  const prev = $('prev');
  prev.style.opacity = .34 * pIn * (1 - pOut);
  prev.style.filter = `blur(${lerp(6, 2, pIn) + pOut * 22}px)`;
  prev.style.transform = `scale(${lerp(.92, .96, pIn) - pOut * .12})`;

  // kicker
  const k = outCubic(prog(t, 1.45, 2.2));
  $('kicker').style.opacity = k;
  $('kicker').style.transform = `translateY(${lerp(24, 0, k)}px)`;

  // number impact at 2.0s
  const n = outExpo(prog(t, 2.0, 2.9));
  const num = $('num');
  num.style.opacity = prog(t, 2.0, 2.12);
  num.style.transform = `scale(${lerp(1.38, 1, n)})`;
  num.style.filter = `blur(${lerp(24, 0, n)}px) drop-shadow(0 0 ${lerp(70, 34, n)}px rgba(127,179,198,${lerp(.9, .45, n)}))`;
  const sh = $('numShine');
  sh.style.transform = num.style.transform;
  const shineA = inOut(prog(t, 3.0, 4.1)), shineB = inOut(prog(t, 8.2, 9.2));
  sh.style.opacity = (prog(t, 3.0, 3.1) * (1 - prog(t, 4.0, 4.1))) + (prog(t, 8.2, 8.3) * (1 - prog(t, 9.1, 9.2)));
  sh.style.backgroundPosition = `${t < 6 ? lerp(110, -10, shineA) : lerp(110, -10, shineB)}% 0`;

  const g = prog(t, 1.98, 2.08) * (1 - outCubic(prog(t, 2.1, 3.4)));
  glow.style.opacity = g * .95 + .22 * prog(t, 2.5, 3.5);
  glow.style.transform = `scale(${lerp(.6, 1.15, outCubic(prog(t, 2, 3)))})`;
  const f = prog(t, 1.99, 2.05) * (1 - outCubic(prog(t, 2.1, 3.0)));
  flare.style.opacity = f;
  const fw = W * lerp(.1, 1.6, outExpo(prog(t, 2, 2.6)));
  flare.style.width = fw + 'px'; flare.style.marginLeft = (-fw / 2) + 'px';
  $('flash').style.opacity = .85 * prog(t, 1.99, 2.04) * (1 - outCubic(prog(t, 2.05, 2.7)));

  // unit
  const u = outCubic(prog(t, 2.55, 3.3));
  $('unit').style.opacity = u;
  $('unit').style.letterSpacing = lerp(1.1, .7, u) + 'em';

  // tagline word by word
  words.forEach((w, i) => {
    const a = outCubic(prog(t, 3.3 + i * .085, 3.3 + i * .085 + .6));
    w.style.opacity = a;
    w.style.filter = `blur(${lerp(10, 0, a)}px)`;
    w.style.transform = `translateY(${lerp(18, 0, a)}px)`;
  });

  // logo reveal (light wipe) at 4.6s
  const lo = outCubic(prog(t, 4.6, 5.6));
  lw.style.opacity = lo;
  lw.style.transform = `translateY(${lerp(26, 0, lo)}px) scale(${lerp(1.06, 1, lo)})`;
  lw.style.filter = `blur(${lerp(14, 0, lo)}px)`;
  lw.style.clipPath = `inset(0 ${lerp(50, 0, outExpo(prog(t, 4.6, 5.4)))}% 0 ${lerp(50, 0, outExpo(prog(t, 4.6, 5.4)))}%)`;
  $('logoShine').style.backgroundPosition = `${lerp(110, -10, inOut(prog(t, 5.5, 6.7)))}% 0`;
  $('logoShine').style.opacity = prog(t, 5.5, 5.6) * (1 - prog(t, 6.6, 6.7));

  // footer
  const ft = outCubic(prog(t, 5.6, 6.5));
  $('footTxt').style.opacity = ft;
  $('footTxt').style.transform = `translateY(${lerp(12, 0, ft)}px)`;
  const rl = outExpo(prog(t, 5.8, 6.8));
  $('ruleL').style.transform = $('ruleR').style.transform = `scaleX(${rl})`;
}

window.__render = render;
window.__ready = document.fonts.ready.then(() => Promise.all(
  [...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = r))));
render(Q.has('t') ? parseFloat(Q.get('t')) : 9.9);
</script>
</body>
</html>
