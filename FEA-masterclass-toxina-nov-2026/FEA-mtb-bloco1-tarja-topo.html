<!-- FEA | Masterclass Toxina 9/11 | BLOCO 1: tarja do topo
     Colar num widget HTML do Elementor, DENTRO do container vermelho atual
     (no lugar do título "O treinamento gratuito começa em:" e do widget de contagem).
     O container vermelho continua como está: ele já tem o fundo e a fixação no topo. -->
<style>
.fea-mtb-topo{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;color:#F9F9F9;line-height:1.15;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.fea-mtb-topo .fea-eb{font-size:clamp(8.5px,2.55vw,12px);font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;margin:0}
.fea-mtb-topo .fea-ln{margin:3px 0 0;display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap}
.fea-mtb-topo .fea-dt{font-size:17px;font-weight:800}
.fea-mtb-topo .fea-cd{font-size:11.5px;font-weight:500;color:rgba(249,249,249,.8);font-variant-numeric:tabular-nums}
</style>
<div class="fea-mtb-topo" role="region" aria-label="Data da masterclass">
  <p class="fea-eb">Masterclass gratuita + oferta da Black Friday Vitalícia</p>
  <p class="fea-ln"><span class="fea-dt">9/11 às 20h</span><span class="fea-cd" id="fea-mtb-cd">ao vivo no Zoom</span></p>
</div>
<script>
(function(){
  /* Fim da contagem: segunda, 9/11/2026, 20h de Brasília (UTC-3, sem horário de verão) */
  var alvo = new Date('2026-11-09T20:00:00-03:00').getTime();
  var el = document.getElementById('fea-mtb-cd');
  if(!el) return;
  function dois(n){return (n<10?'0':'')+n;}
  function tick(){
    var s = Math.floor((alvo - Date.now())/1000);
    if(s <= 0){ el.textContent = 'a aula começou, ao vivo no Zoom'; return; }
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
    el.textContent = 'faltam ' + (d>0 ? d+'d ' : '') + dois(h)+'h ' + dois(m)+'min';
    setTimeout(tick, 1000*(60 - new Date().getSeconds()) || 1000);
  }
  tick();
})();
</script>
